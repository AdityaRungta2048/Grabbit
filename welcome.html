<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="wPageTitle">Welcome to Grabbit</title>
  <link rel="stylesheet" href="panel.css" />
  <style>
    body { align-items: center; padding: 48px 16px; }
    main { max-width: 680px; width: 100%; }
    h1 { font-size: 32px; letter-spacing: -.02em; margin: 14px 0 6px; }
    .lead { font-size: 16px; color: var(--muted); margin: 0 0 28px; }
    ol { list-style: none; padding: 0; display: grid; gap: 12px; counter-reset: s; }
    li { counter-increment: s; display: flex; gap: 14px; align-items: flex-start; font-size: 14.5px; }
    li::before { content: counter(s); flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
    kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; font: 600 12px ui-monospace, monospace; background: var(--card); }
    .feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 28px; }
    .feat .card { margin: 0; }
    .feat b { display: block; margin-bottom: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="icons/128.png" width="72" height="72" alt="" />
    <h1 data-i18n="wTitle">Grabbit is ready 🐰</h1>
    <p class="lead" data-i18n="wLead">Turn any website into a spreadsheet in seconds. Free, private, and no account needed.</p>
    <section class="card">
      <ol>
        <li><span data-i18n-html="wStep1"></span></li>
        <li><span data-i18n-html="wStep2"></span></li>
        <li><span data-i18n-html="wStep3"></span></li>
        <li><span data-i18n-html="wStep4"></span></li>
      </ol>
    </section>
    <div class="feat">
      <div class="card"><b>📄 <span data-i18n="multiplePages"></span></b><span class="muted" data-i18n="wf1"></span></div>
      <div class="card"><b>✉️ <span data-i18n="qContacts"></span></b><span class="muted" data-i18n="wf2"></span></div>
      <div class="card"><b>🌐 <span data-i18n="wBulk"></span></b><span class="muted" data-i18n="wf3"></span></div>
      <div class="card"><b>⏰ <span data-i18n="wSchedules"></span></b><span class="muted" data-i18n="wf4"></span></div>
      <div class="card"><b>🖼️ <span data-i18n="wImageDl"></span></b><span class="muted" data-i18n="wf5"></span></div>
      <div class="card"><b>🔒 <span data-i18n="wPrivate"></span></b><span class="muted" data-i18n="wf6"></span></div>
    </div>
  </main>
  <script src="i18n.js"></script>
</body>
</html>

const lang = L[new URLSearchParams(location.search).get('lang')] ? new URLSearchParams(location.search).get('lang') : 'en';
const s = L[lang];
const [cur, rate, step, end] = MONEY[lang];
const digits = Number.isInteger(end) ? 0 : 2; // whole-number prices for yen, won, rupees…
const fmt = new Intl.NumberFormat(lang.replace('_', '-'), { style: 'currency', currency: cur, minimumFractionDigits: digits, maximumFractionDigits: digits });
const price = (usd) => fmt.format(Math.round((usd * rate) / step) * step + end); // e.g. 129 USD -> 118,99 €
const img = (c) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='240' height='160'><rect width='240' height='160' fill='${c}' opacity='.18'/><circle cx='120' cy='80' r='46' fill='${c}'/><rect x='70' y='118' width='100' height='12' rx='6' fill='${c}' opacity='.5'/></svg>`);

document.documentElement.lang = lang.replace('_', '-');
s.nav.forEach((t, i) => (document.getElementById('n' + i).textContent = t));
document.getElementById('h1').textContent = s.h1;
document.getElementById('sub').textContent = s.sub;
document.getElementById('next').textContent = s.next;
document.getElementById('foot').textContent = `${s.foot} hello@northpeakoutdoor.co · +1 (303) 555-0187`;
document.getElementById('grid').innerHTML = s.p.map((name, i) => `<article class="card"><img src="${img(COLORS[i])}" alt="${name}"><h3 class="name"><a href="/p/${i}">${name}</a></h3><div class="meta"><span class="price">${price(USD[i])}</span><span class="stars">★ ${STARS[i]}</span></div><span class="ship">${s.ship[i % 2]}</span></article>`).join('');
